# Gradle's signing plugin defaults to invoking `gpg2`, which Homebrew's gnupg does not
# install — it provides `gpg` only. Used when signing via SIGNING_USE_GPG_CMD=true.
signing.gnupg.executable=gpg

# Never put credentials in this file — it is committed. SIGNING_KEY, SIGNING_PASSWORD,
# MAVEN_CENTRAL_USERNAME, and MAVEN_CENTRAL_PASSWORD are read from the environment.
