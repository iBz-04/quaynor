name: "Rust crate install test"

# Cross-platform build check for the published crate. This is what catches a
# `quaynor` release that does not compile on a consumer's machine, so it guards
# the manual crates.io publish.
#
# Manual-only: every job compiles llama.cpp from scratch (~20 min on Windows),
# which is far too heavy for every PR. Run it from the Actions tab before a
# crates.io publish (see quaynor/core/RELEASING.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: "Ubuntu (apt)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev build-essential \
            libvulkan-dev libshaderc-dev glslc vulkan-tools

      - name: cargo check
        working-directory: quaynor
        run: cargo check -p quaynor --locked

  macos:
    name: "macOS"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install libomp
        run: brew install libomp

      - name: cargo check
        working-directory: quaynor
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export LDFLAGS="-L$(brew --prefix libomp)/lib"
          export CPPFLAGS="-I$(brew --prefix libomp)/include"
          cargo check -p quaynor --locked

  windows:
    name: "Windows"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        shell: bash

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      # choco installs the SDK but does not export VULKAN_SDK to later steps,
      # which llama-cpp-sys-2's build script requires. ggml-vulkan calls
      # find_package(SPIRV-Headers CONFIG REQUIRED); the Windows SDK only
      # ships those CMake config files from ~1.4.313 onward, so the version
      # must stay >= that, and stripdown must stay false because it removes
      # them.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.328.1
          cache: true
          install_runtime: true
          stripdown: false

      - name: Install Ninja
        run: choco install ninja

      - name: cargo check
        working-directory: quaynor
        env:
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}/lib
          # Ninja avoids a CMake ExternalProject install-step failure that the
          # Visual Studio generator hits building vulkan-shaders-gen.
          CMAKE_GENERATOR: "Ninja"
        run: cargo check -p quaynor --locked

  nix:
    name: "Nix"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: cargo check inside nix shell
        run: |
          nix-shell quaynor/shell.nix --run "cd quaynor && cargo check -p quaynor --locked"
