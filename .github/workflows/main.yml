name: "CI"
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full_ci:
        type: boolean
        default: true
        description: 'Run full CI suite (all platforms, all tests)'

# Read-only. Releases are published manually — nothing here needs write access.
permissions:
  contents: read

jobs:
  rust_quality:
    uses: ./.github/workflows/rust_quality.yml

  security:
    uses: ./.github/workflows/security.yml

  python_ci:
    uses: ./.github/workflows/python_ci.yml
    with:
      full_ci: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event_name == 'workflow_dispatch' && inputs.full_ci) }}

  build:
    uses: ./.github/workflows/build.yml
    with:
      full_ci: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event_name == 'workflow_dispatch' && inputs.full_ci) }}

  react_native_ci:
    uses: ./.github/workflows/react_native_ci.yml
    with:
      full_ci: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event_name == 'workflow_dispatch' && inputs.full_ci) }}
