name: "rust_quality"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting needs no dependencies and no llama.cpp build, so it runs on its
  # own and gives fast feedback.
  rustfmt:
    name: "rustfmt"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: "Setup rust toolchain"
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: "Check formatting"
        working-directory: ./quaynor
        run: cargo fmt --all --check

  clippy:
    name: "clippy + check"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: "Cache Cargo Home"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            quaynor/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: "Setup rust toolchain"
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libshaderc-dev libvulkan-dev glslc

      # quaynor-flutter is excluded because its frb_generated.rs is machine
      # generated by flutter_rust_bridge and calls a deprecated (but still
      # supported) core method. Any hand-added allow there is clobbered on the
      # next regeneration.
      - name: "Clippy"
        working-directory: ./quaynor
        run: cargo clippy --workspace --exclude quaynor-flutter --all-targets --locked -- -D warnings

      - name: "Clippy (flutter, non-blocking)"
        working-directory: ./quaynor
        continue-on-error: true
        run: cargo clippy -p quaynor-flutter --all-targets --locked

  test:
    name: "unit tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: "Cache Cargo Home"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            quaynor/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: "Setup rust toolchain"
        run: |
          rustup update stable
          rustup default stable

      # Only the grammar crates are exercised here. The core engine's tests are
      # integration-style and need real GGUF weights (TEST_MODEL and friends),
      # so they are not run on CI.
      - name: "Grammar crate tests"
        working-directory: ./quaynor
        run: cargo test -p quaynor-gbnf -p quaynor-gbnf-macro --locked

  # Guards the crates.io release: catches a manifest that cannot be packaged
  # (missing metadata, a git dependency, a file left out) before a manual
  # publish rather than after.
  package:
    name: "package (crates.io dry run)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: "Setup rust toolchain"
        run: |
          rustup update stable
          rustup default stable

      - name: "Package grammar crates"
        working-directory: ./quaynor
        run: |
          cargo package -p quaynor-gbnf --locked
          # quaynor-gbnf-macro and quaynor depend on quaynor-gbnf by version, so
          # they can only be packaged once it is on crates.io. Until then, verify
          # their manifests instead.
          cargo verify-project --manifest-path grammar/gbnf-macro/Cargo.toml
          cargo verify-project --manifest-path core/Cargo.toml
